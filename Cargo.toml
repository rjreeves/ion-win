[package]
name = "ion-win"
version = "1.2.1"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
redb = "2.0"
glob = "0.3"
crossterm = "0.27"
ctrlc = "3"
regex = "1"
unicode-segmentation = "1.12"
unicode-width = "0.2.2"
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10.4"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
zip = { version = "8", default-features = false, features = ["deflate", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Threading", "Win32_System_Console", "Win32_System_JobObjects", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
# Crossterm 0.27 clears a pending UTF-16 high surrogate when Windows
# interleaves its key-release record before the low surrogate. The local
# patch preserves the pair, so pasted emoji and other non-BMP characters
# reach the editor intact.
crossterm = { path = "vendor/crossterm" }
